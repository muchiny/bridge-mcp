# typos configuration
# https://github.com/crate-ci/typos

# The CI job pins `crate-ci/typos@v1`, which floats: a dictionary bump in a new
# typos release turns a green main red without a single source change (v1.49.0
# did exactly that). Entries below must stay *precise* — a bare word would
# disable that correction repository-wide and hide a real typo later.

[default]
extend-ignore-identifiers-re = [
    # Company names
    "HashiCorp",
    "Hashi",
    # Mermaid diagram node IDs (e.g., K8SROLL, K8SGET)
    "K8S[A-Z]+",
    # base64("user:hunter2") — Authorization: Basic redaction test vector in
    # src/security/sanitizer.rs. typos reads the "ZIy" tail as `Iy` -> `It`.
    "dXNlcjpodW50ZXIy",
    # W3C Trace Context example `traceparent`, used verbatim as a test vector
    # in src/mcp/request_meta.rs. typos reads the parent-id's "0ba9" as
    # `ba` -> `by`/`be`. Pinned to the exact 16-hex span rather than allowing
    # `ba`, which would disable that correction everywhere.
    "00f067aa0ba902b7",
    # A DELIBERATE typo, quoted as the illustration of the bug it caused:
    # `jq_fitler=…` was accepted in silence and returned the full unreduced
    # output, indistinguishable from a working call. Correcting it in the prose
    # would remove the very thing the sentence is about.
    "jq_fitler",
]

[default.extend-words]
# French words used in documentation
projet = "projet"
# Legitimate code patterns
secur = "secur"
routeros = "routeros"
# BRE = Basic Regular Expression (grep regex flavor)
BRE = "BRE"

[files]
# Ignore generated files
extend-exclude = [
    "target/",
    "*.lock",
    "PLAN.md",
    # Internal French research/planning artifact — prose, not shipped docs
    "docs/feature-research-2026-06.md",
]
