# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check

[graph]
# Targets to check (all by default)
targets = []
# Exclude dev-dependencies from checks
exclude-dev = false
# Match what CI actually analyses. Without this, a local `cargo deny` resolves
# only the default feature set — 333 packages against CI's 587 — so the whole
# optional surface (aws-sdk/ssm, kube, winrm, psrp) is invisible locally and
# the local gate is a strict SUBSET of the remote one. That is how
# RUSTSEC-2026-0258 (h2 0.3.27, reachable only via aws-smithy) turned main red
# while `cargo deny check advisories` reported "advisories ok" on a dev
# machine, complete with an `advisory-not-detected` warning on the very entry
# that was needed.
all-features = true

# =============================================================================
# Advisories - check for known vulnerabilities
# =============================================================================
[advisories]
version = 2
# Audit 2026-05-09 (FIND-026): yanked releases break CI so a maintainer
# pulling a backdoored release does not silently survive.
yanked = "deny"
# RUSTSEC-2023-0071: Marvin Attack on RSA - no fix available upstream
# Transitive dependency from russh -> rsa crate
# Safe for local use, timing attack requires network observation
ignore = [
    "RUSTSEC-2023-0071",   # Marvin Attack on RSA — transitive from russh, no upstream fix
    # Re-triggered by the v1.19.0 dep bumps: the kube 4.0 / AWS stack re-introduced
    # rustls 0.21 -> rustls-webpki 0.101.7 via aws-smithy-http-client. ONLY reachable
    # under the optional `ssm`/`cloud` AWS feature (default + air-gapped builds are
    # clean). The patched webpki (>=0.103.12) requires rustls 0.23, which the pinned
    # aws-smithy stack cannot reach via cargo update. AWS endpoints present trusted
    # certs; these are reachable only after certificate misissuance.
    "RUSTSEC-2026-0098",   # webpki URI name constraints — transitive via aws-smithy rustls 0.21
    "RUSTSEC-2026-0099",   # webpki wildcard name constraint — transitive via aws-smithy rustls 0.21
    "RUSTSEC-2026-0104",   # webpki CRL IssuingDistributionPoint panic — transitive via aws-smithy rustls 0.21
    # h2 unbounded empty DATA frames (published 2026-08-18), patched in h2
    # >=0.4.16 ONLY. This lockfile is already on 0.4.16, so the entry below
    # suppresses exactly one remaining match: h2 0.3.27, which has no patched
    # release on its own major line and is pulled transitively by
    # aws-smithy-http-client 1.1.13 -> aws-smithy-runtime -> aws-config /
    # aws-sdk-ssm. Same shape and same reachability as the webpki entries
    # above: OPTIONAL `ssm`/`cloud` features only — default, `full` and
    # air-gapped builds never compile it. `cargo-deny` cannot scope an
    # advisory ignore to a version (the crate@version form is for yanked
    # crates only), so removing this entry is the check that the aws-smithy
    # stack has moved off h2 0.3.
    "RUSTSEC-2026-0258",   # h2 0.3 unbounded empty DATA frames — transitive via aws-smithy, no 0.3 fix
    # rustls advisories published 2026-10-14. Four were raised; two are gone from
    # the lockfile because rustls 0.23.45 -> 0.23.46 fixes them (RUSTSEC-2026-0347
    # ECH buffered data, RUSTSEC-2026-0348 brotli cert decompression — both 0.23-only
    # features). The two below match the OTHER rustls in the tree, 0.21.12, for which
    # there is NO fix on its own major line: every one of the four advisories says
    # "upgrade to >=0.23.46". Same chain and same reachability as the webpki and h2
    # entries above: aws-smithy-http-client 1.1.13 -> hyper-rustls 0.24.2 ->
    # tokio-rustls 0.24.1 -> rustls 0.21.12, pulled by aws-config / aws-sdk-ssm under
    # the OPTIONAL `ssm`/`cloud` features. Measured: `full` is
    # ["cli","mimalloc","http","jq","otel"] and RELEASE_FEATURES is `full,winrm,psrp`,
    # so no shipped binary compiles rustls 0.21 at all — `cargo audit` reads the
    # lockfile, not the feature graph, which is why the gate reddens anyway.
    # 0346 additionally requires something to Debug-print client session values, which
    # this crate never does. As with h2 0.3, cargo-deny cannot scope an ignore to a
    # version, so removing these two entries is the check that the aws-smithy stack
    # has left rustls 0.21.
    "RUSTSEC-2026-0346",   # rustls Debug impls expose TLS secrets — transitive via aws-smithy rustls 0.21
    "RUSTSEC-2026-0349",   # rustls ServerHello KEX downgrade — transitive via aws-smithy rustls 0.21
    # Verified no longer matched (kept here as historical context):
    # - RUSTSEC-2025-0134 (rustls-pemfile unmaintained)
    # - RUSTSEC-2026-0049 (rustls-webpki CRL matching)
    # - RUSTSEC-2026-0074 (libcrux-ml-kem SHAKE API — patched upstream in russh)
    # - RUSTSEC-2026-0194 / 0195 (quick-xml DoS) — removed 2026-10-14: psrp-rs 2.0.2
    #   resolves quick-xml 0.42.0, past the >=0.41 fix, and `cargo deny` reported
    #   "no crate matched advisory criteria" for both. That warning IS the removal
    #   condition those entries documented.
]

# =============================================================================
# Licenses - ensure dependencies use acceptable licenses
# =============================================================================
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",  # Used by aws-lc-sys (russh dependency)
    "CDLA-Permissive-2.0",  # Used by webpki-root-certs / webpki-roots
]
confidence-threshold = 0.8

# Clarify licenses for specific crates if needed
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# =============================================================================
# Bans - deny or allow specific crates
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates (security/quality concerns)
deny = [
    # { name = "openssl" }  # Prefer rustls
]

# Skip duplicate version checks for these crates
skip = []

# Skip tree (ignore entire dependency subtrees)
skip-tree = []

# =============================================================================
# Sources - restrict where crates can come from
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
