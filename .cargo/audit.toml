# cargo-audit configuration
# https://rustsec.org/

[advisories]
# Advisories to ignore (no fix available upstream)
ignore = [
    # Marvin Attack on RSA - timing sidechannel
    # Transitive dependency: russh -> rsa 0.10.0-rc.12
    # Severity: 5.9 (medium) - not critical for CLI tool
    # No fixed version available
    "RUSTSEC-2023-0071",
    # aws-sdk pins rustls 0.21 / rustls-webpki 0.101.7 via
    # aws-smithy-http-client 1.1.12. The three advisories below are
    # patched in rustls-webpki >=0.103.12 but that version can only be
    # pulled once aws-sdk bumps its TLS stack (unrelated to this crate).
    # All three require certificate misissuance to exploit and are
    # reachable only after signature verification — acceptable risk for
    # the cloud feature. Same list as deny.toml.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 unbounded empty DATA frames (2026-08-18). Patched in h2 >=0.4.16
    # only; the lockfile is already there. The remaining match is h2 0.3.27,
    # transitive via aws-smithy-http-client -> aws-config / aws-sdk-ssm, with
    # no patched 0.3 release. Optional `ssm`/`cloud` features only. Remove
    # once the aws-smithy stack leaves h2 0.3. Same list as deny.toml.
    "RUSTSEC-2026-0258",
    # rustls advisories published 2026-10-14. Of the four raised, two are fixed in
    # the lockfile by rustls 0.23.45 -> 0.23.46 (RUSTSEC-2026-0347, -0348, both
    # 0.23-only features). The two below match rustls 0.21.12, which has no fix on
    # its own major line — all four advisories say "upgrade to >=0.23.46". Transitive
    # via aws-smithy-http-client -> hyper-rustls 0.24 -> tokio-rustls 0.24 ->
    # rustls 0.21, pulled by aws-config / aws-sdk-ssm under the optional
    # `ssm`/`cloud` features, which no shipped build enables (`full` has no `ssm`).
    # Remove once the aws-smithy stack leaves rustls 0.21. Same list as deny.toml.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
]

# Warn instead of error for informational advisories
informational_warnings = ["unmaintained"]
