# Cargo configuration
# https://doc.rust-lang.org/cargo/reference/config.html

[alias]
# Development shortcuts
dev = "watch -x 'check --all-targets'"
lint = "clippy --all-targets --all-features -- -D warnings"
fmt-check = "fmt --all -- --check"
test-all = "nextest run"
# Note: cargo audit is an external command, not an alias

[build]
# Faster incremental builds
incremental = true

# No `target-cpu` here, for any target. `native` means "the CPU of the machine
# running rustc": under `cross` (release.yml) that is the x86 runner, so the
# aarch64 release binary was handed an x86 CPU (`icelake-server`, AVX-512).
# rustc 1.98 ignored it (~194,000 "not a recognized feature" lines in the
# v3.0.0 arm64 job); rustc 1.99.1 segfaults on it in fat-LTO codegen, which
# is what failed the v4.0.0 release. Even on a native ARM
# build it would tie the shipped binary to the build machine's CPU. To tune a
# local build for the host it runs on, use RUSTFLAGS="-C target-cpu=native".
