# Local development toolchain. Pinned to the MSRV so a post-MSRV feature can
# never slip in unnoticed on a dev machine.
#
# RAISED 1.94.0 -> 1.98.0 on 2026-09-03, forced rather than chosen: `winrm-rs`
# 1.2.0 declares `rust-version = "1.98.0"`, and cargo refuses the dependency
# outright on an older compiler ("rustc 1.94.0 is not supported by the
# following package"). 1.2.0 is where RUSTSEC-2026-0190/0185/0098 are fixed, so
# staying behind meant carrying three advisories.
#
# WHAT THIS COSTS, stated plainly: 1.98.0 IS the current stable, so the MSRV
# guard is temporarily vacuous — the `MSRV (1.98)` CI job and the Clippy job
# now compile with the same rustc, and a 1.98-only feature would pass both. The
# guard comes back the first time stable moves past 1.98. Until then, nothing
# in CI can tell you that this crate still builds for a consumer one release
# behind, because there is no such consumer left within the MSRV.
#
# CAUTION for CI: a toolchain file OUTRANKS the `rustup default` that
# dtolnay/rust-toolchain sets, so a workflow step that merely installs
# `stable`/`beta`/`nightly` still runs the channel below. Only `cargo
# +<channel>` and the RUSTUP_TOOLCHAIN env var beat this file — every workflow
# therefore sets RUSTUP_TOOLCHAIN explicitly. Do not drop those env blocks.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
