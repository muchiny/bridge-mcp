[profile.default]
retries = 0

# The watcher's decision logic is deterministic (pure should_process_event,
# unit-tested), but this end-to-end test still depends on real inotify event
# DELIVERY latency, which varies under instrumented builds (llvm-cov).
[[profile.default.overrides]]
filter = "test(test_config_watcher_detects_changes)"
retries = 2
