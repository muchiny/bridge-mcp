# SonarQube Cloud, analysed by the `sonar` job of .github/workflows/ci.yml.
# SonarCloud's Automatic Analysis skips Rust: keep it disabled
# (Administration > Analysis Method), the two analysis methods conflict.
sonar.organization=muchiny
sonar.projectKey=muchiny_bridge-mcp
sonar.projectName=bridge-mcp
sonar.sourceEncoding=UTF-8

# Scope. Main code: the crate, the proc-macro crate, the benches, the example,
# the fuzz targets, the Python scripts and the workflows (GitHub Actions
# rules). Out of scope: docs/, specs/, supply-chain/, plugin/, contrib/, dxt/,
# config/.
sonar.sources=src,crates,benches,examples,fuzz/fuzz_targets,scripts,.github
sonar.tests=tests
sonar.exclusions=**/target/**
# Anonymized fixtures are data, not code.
sonar.test.exclusions=tests/fixtures/**

# Coverage: coverage/cobertura.xml comes from `cargo llvm-cov` (`coverage` job).
# That report measures the root package only, and never src/ code behind a
# feature the job does not enable. Benches, the example, fuzz targets, Python
# scripts, workflows and the proc-macro crate have no report: without this
# exclusion they would count as 0 % and fail the quality gate.
sonar.rust.cobertura.reportPaths=coverage/cobertura.xml
sonar.coverage.exclusions=benches/**,examples/**,fuzz/**,scripts/**,crates/**,.github/**

# Clippy issues (default lints + hardened lints), written by the `sonar` job.
sonar.rust.clippyReport.reportPaths=clippy-report.json
