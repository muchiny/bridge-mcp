version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      # The OpenTelemetry crates share types (KeyValue, …) and only compile at
      # matching versions: bumped one at a time, every PR breaks the build.
      # Listed first so a dependency lands in this group, not rust-minor-patch.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
