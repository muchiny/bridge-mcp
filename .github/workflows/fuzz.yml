name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3am UTC
    - cron: "0 4 1 * *" # Monthly (1st, 4am UTC): corpus minimization run
  workflow_dispatch:
    inputs:
      target:
        description: "Specific fuzz target (blank for all)"
        required: false
        default: ""
      duration:
        description: "Duration per target in seconds"
        required: false
        default: "30"

# Cancelling mid-run would lose the corpus the run just discovered (the
# cache is only saved at job end), so serialise instead.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# Job-level permissions below (zizmor excessive-permissions): issues: write is
# needed only by the "Create issue on crash" step.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # libFuzzer needs nightly, and rust-toolchain.toml would otherwise pin this
  # job to 1.94.0 regardless of what dtolnay/rust-toolchain installed. The
  # explicit `cargo +nightly` calls below already win, but keeping the env in
  # sync means `cargo install` and any future plain `cargo` call agree.
  RUSTUP_TOOLCHAIN: nightly

jobs:
  fuzz:
    name: Fuzz testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write # file a bug when a fuzz target crashes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz

      # cargo-fuzz has no prebuilt binary in taiki-e/install-action.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Accumulating corpus: the per-run key never matches, so the freshest
      # `fuzz-corpus-*` entry is restored via the prefix and a new snapshot
      # (with everything this run discovered) is saved at job end. Without
      # this, every nightly run restarts coverage-guided exploration from
      # zero and 30s/target only ever scratches the same shallow surface.
      - name: Restore fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Seed corpus from committed seeds
        run: |
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp -n "$dir"* "fuzz/corpus/$target/" 2>/dev/null || true
          done

      - name: Minimize corpus (monthly)
        if: github.event.schedule == '0 4 1 * *'
        run: |
          for target in $(cargo +nightly fuzz list); do
            if [ -d "fuzz/corpus/$target" ]; then
              cargo +nightly fuzz cmin "$target" 2>&1 || true
            fi
          done

      # Build before fuzzing, and fail the job outright if the harness does not
      # compile. The run step below treats any non-zero exit from `cargo fuzz
      # run` as a crash, and `cargo fuzz` reports a build failure through that
      # same exit code — so a harness that stopped compiling looked exactly
      # like 57 simultaneous crashes. It stayed that way from 2026-07-03 to
      # 2026-08-17: the job exited green in ~45 seconds having fuzzed nothing,
      # and filed a "found crashes" issue every night (47 of them, all false).
      # Separating the two makes a broken harness a red job instead of a
      # silent one.
      # One invocation, not one per target: `cargo fuzz build` with no TARGET
      # builds them all. The per-target loop this replaces re-entered cargo 57
      # times and, worse, stopped at the first failure under `bash -e` — so the
      # first run after the harness was unblocked reported exactly one broken
      # target and hid however many followed it.
      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      - name: Run fuzz targets
        # Dispatch inputs go through env so they are never interpolated
        # into the shell script (template-injection hardening).
        env:
          DEFAULT_DURATION: ${{ inputs.duration || '30' }}
          SPECIFIC_TARGET: ${{ inputs.target }}
        run: |
          # Security-critical targets get extra time
          # `fuzz_yaml_config` and `fuzz_host_config` joined the moment they
          # stopped calling saphyr bare: one asserts that a parse error never
          # echoes a `password:` from the config it failed on, the other that an
          # omitted host key policy stays Strict. Both are security answers, and
          # 30s is not enough to reach them from an empty corpus.
          #
          # `fuzz_whitelist_grant` and `fuzz_completions_params` joined for the
          # same reason. The first asks whether a whitelist pattern the regex
          # engine REFUSED can still grant a command; every iteration compiles
          # a pattern, so it runs two orders of magnitude slower than a parser
          # target (37 915 executions in 61s locally against ~800 000) and 30s
          # buys correspondingly little. The second drives the whole
          # `completion/complete` dispatch against a 150-host config to ask
          # whether the answer can name a host the prefix does not select.
          # +60s total on a phase already near 66 minutes, which is the
          # cheapest promotion available: `BUILDER_TARGETS` costs 270s each.
          SECURITY_TARGETS="fuzz_command_validator fuzz_sanitizer fuzz_shell_escape \
            fuzz_security_config fuzz_yaml_config fuzz_host_config \
            fuzz_whitelist_grant fuzz_completions_params"

          # Command-builder targets get the shell dictionary AND 300s.
          #
          # Without a dictionary libFuzzer has to discover `$(` by mutating
          # bytes at random, which it will not do in 30 seconds. Measured on
          # fuzz_network_equipment_builder: with the dict, removing the
          # identifier validation is caught in seconds; the tokens are what
          # makes the difference, not the wall clock.
          # Every target whose invariant is about what a caller's value does
          # to a command line belongs here, not just the first one written.
          # These five went from `let _ = builder(...)` — which sees a panic
          # and nothing else — to asserting that the caller contributes no
          # shell syntax, so the dictionary is now what makes them useful.
          #
          # Budget: this takes the fuzzing phase from roughly 36 to 62 minutes
          # (6 more targets at 300s instead of 30s, and fuzz_shell_escape from
          # 60s to 300s), plus about 4.5 more for fuzz_elicitation_params below
          # — roughly 66 minutes, which with the build leaves about 45 of the
          # job's 120. Another target at 300s is fine; twenty are not, so raise
          # `timeout-minutes` at the same time if you add them.
          #
          # `fuzz_resource_uri` joined on that criterion and not by theme: a
          # `file://` or `log://` path is interpolated into `cat {path}` and
          # `tail -n {n} {path}`, so what it asserts IS what a caller's value
          # does to a command line. It also gains a target
          # (`fuzz_relative_duration`, at the 30s default) and two promotions to
          # SECURITY_TARGETS below — about 6 minutes in all, so roughly 72 of
          # the job's 120.
          #
          # Then eight targets were deleted for measuring `serde_json` rather
          # than this crate, giving 4 minutes back (8 x 30s) and leaving roughly
          # 68. That is headroom to spend on a target that asserts something,
          # not a saving to bank.
          BUILDER_TARGETS="fuzz_network_equipment_builder \
            fuzz_network_command_builder \
            fuzz_nginx_command_builder \
            fuzz_firewall_command_builder \
            fuzz_process_command_builder \
            fuzz_package_command_builder \
            fuzz_shell_escape \
            fuzz_resource_uri"
          DICT_ARG="-dict=fuzz/dicts/shell.dict"

          # The shell dictionary, DECOUPLED from the 300s tier.
          #
          # It used to be welded to `BUILDER_TARGETS`: a target could only get
          # the tokens by also getting 300 seconds. That coupling is what made
          # the twenty remaining command builders unaffordable — 20 x 270s is
          # +90 minutes on a phase already at 69 of the job's 120, so 159
          # minutes and over the cap.
          #
          # Measured, and the comment above says it first: "the tokens are
          # what makes the difference, not the wall clock". So these twenty
          # take the dictionary at the 60s security tier instead: +10 minutes,
          # 79 total, 41 to spare. If one of them starts finding things and
          # deserves 300s, promote it into BUILDER_TARGETS one at a time and
          # re-do this arithmetic — the file already warns that twenty at once
          # is not affordable without raising `timeout-minutes`.
          DICT_ONLY_TARGETS="fuzz_active_directory_builder \
            fuzz_ansible_command_builder \
            fuzz_certificate_command_builder \
            fuzz_cron_command_builder \
            fuzz_db_command_builder \
            fuzz_docker_command_builder \
            fuzz_git_command_builder \
            fuzz_helm_command_builder \
            fuzz_hyperv_builder \
            fuzz_iis_builder \
            fuzz_k8s_command_builder \
            fuzz_redis_command_builder \
            fuzz_scheduled_task_builder \
            fuzz_systemd_command_builder \
            fuzz_terraform_command_builder \
            fuzz_vault_command_builder \
            fuzz_windows_event_builder \
            fuzz_windows_firewall_builder \
            fuzz_windows_registry_builder \
            fuzz_windows_service_builder"

          # The confirmation prompt's integrity is a MARKDOWN property, not a
          # shell one: what must never happen is the content closing the fence
          # it is inside. shell.dict carries a lone backtick and nothing else
          # of use here, so this target gets its own tokens — fences of each
          # width, the two headings, and the line endings CommonMark counts.
          # It found the tool-name hole while running with shell.dict, whose
          # only relevant token is that lone backtick — the fences and the
          # headings came from libFuzzer's comparison feedback (`DE:
          # "**Command:**"` in the run log), which works only because the code
          # happens to compare against those literals. That is luck to be
          # grateful for, not a mechanism to depend on. No before/after timing
          # was measured, so this claims none: the tokens are here because they
          # are the structure the property is about.
          MARKDOWN_TARGETS="fuzz_elicitation_params"
          MD_DICT_ARG="-dict=fuzz/dicts/markdown.dict"

          if [ -n "$SPECIFIC_TARGET" ]; then
            echo "::group::Fuzzing $SPECIFIC_TARGET for ${DEFAULT_DURATION}s"
            # Same crash bookkeeping as the all-targets branch below: this used
            # to be `|| true`, so a crash found via workflow_dispatch was
            # silently discarded and never filed an issue.
            DICT=""
            if echo "$BUILDER_TARGETS" | grep -qw "$SPECIFIC_TARGET"; then DICT="$DICT_ARG"; fi
            if echo "$DICT_ONLY_TARGETS" | grep -qw "$SPECIFIC_TARGET"; then DICT="$DICT_ARG"; fi
            if echo "$MARKDOWN_TARGETS" | grep -qw "$SPECIFIC_TARGET"; then DICT="$MD_DICT_ARG"; fi
            # shellcheck disable=SC2086 # DICT is one flag or empty, deliberately unquoted
            cargo +nightly fuzz run "$SPECIFIC_TARGET" -- $DICT -max_total_time="$DEFAULT_DURATION" 2>&1 || {
              echo "::error::Crash found in $SPECIFIC_TARGET"
              CRASHES_FOUND=true
            }
            echo "::endgroup::"
          else
            for target in $(cargo +nightly fuzz list); do
              DURATION="$DEFAULT_DURATION"
              DICT=""
              if echo "$SECURITY_TARGETS" | grep -qw "$target"; then
                DURATION=60
              fi
              if echo "$DICT_ONLY_TARGETS" | grep -qw "$target"; then
                DURATION=60
                DICT="$DICT_ARG"
              fi
              if echo "$BUILDER_TARGETS" | grep -qw "$target"; then
                DURATION=300
                DICT="$DICT_ARG"
              fi
              if echo "$MARKDOWN_TARGETS" | grep -qw "$target"; then
                DURATION=300
                DICT="$MD_DICT_ARG"
              fi
              echo "::group::Fuzzing $target for ${DURATION}s"
              # shellcheck disable=SC2086 # DICT is one flag or empty, deliberately unquoted
              cargo +nightly fuzz run "$target" -- $DICT -max_total_time="$DURATION" 2>&1 || {
                echo "::error::Crash found in $target"
                CRASHES_FOUND=true
              }
              echo "::endgroup::"
            done
          fi

          if [ "${CRASHES_FOUND:-false}" = "true" ]; then
            echo "CRASHES_FOUND=true" >> "$GITHUB_ENV"
          fi

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Create issue on crash
        if: env.CRASHES_FOUND == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner,
              repo,
              title: `Fuzz testing found crashes (${new Date().toISOString().split('T')[0]})`,
              body: `Nightly fuzz testing found one or more crashes.\n\nSee [workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) for details.\n\nDownload the crash artifacts to reproduce locally.`,
              labels: ['bug', 'security']
            });
