name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3am UTC
    - cron: "0 4 1 * *" # Monthly (1st, 4am UTC): corpus minimization run
  workflow_dispatch:
    inputs:
      target:
        description: "Specific fuzz target (blank for all)"
        required: false
        default: ""
      duration:
        description: "Duration per target in seconds"
        required: false
        default: "30"

# issues: write is required by the "Create issue on crash" step below.
permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Accumulating corpus: the per-run key never matches, so the freshest
      # `fuzz-corpus-*` entry is restored via the prefix and a new snapshot
      # (with everything this run discovered) is saved at job end. Without
      # this, every nightly run restarts coverage-guided exploration from
      # zero and 30s/target only ever scratches the same shallow surface.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Seed corpus from committed seeds
        run: |
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp -n "$dir"* "fuzz/corpus/$target/" 2>/dev/null || true
          done

      - name: Minimize corpus (monthly)
        if: github.event.schedule == '0 4 1 * *'
        run: |
          for target in $(cargo +nightly fuzz list); do
            if [ -d "fuzz/corpus/$target" ]; then
              cargo +nightly fuzz cmin "$target" 2>&1 || true
            fi
          done

      - name: Run fuzz targets
        # Dispatch inputs go through env so they are never interpolated
        # into the shell script (template-injection hardening).
        env:
          DEFAULT_DURATION: ${{ inputs.duration || '30' }}
          SPECIFIC_TARGET: ${{ inputs.target }}
        run: |
          # Security-critical targets get extra time
          SECURITY_TARGETS="fuzz_command_validator fuzz_sanitizer fuzz_shell_escape fuzz_security_config"

          if [ -n "$SPECIFIC_TARGET" ]; then
            echo "::group::Fuzzing $SPECIFIC_TARGET for ${DEFAULT_DURATION}s"
            cargo +nightly fuzz run "$SPECIFIC_TARGET" -- -max_total_time="$DEFAULT_DURATION" 2>&1 || true
            echo "::endgroup::"
          else
            for target in $(cargo +nightly fuzz list); do
              DURATION="$DEFAULT_DURATION"
              if echo "$SECURITY_TARGETS" | grep -qw "$target"; then
                DURATION=60
              fi
              echo "::group::Fuzzing $target for ${DURATION}s"
              cargo +nightly fuzz run "$target" -- -max_total_time="$DURATION" 2>&1 || {
                echo "::error::Crash found in $target"
                CRASHES_FOUND=true
              }
              echo "::endgroup::"
            done
          fi

          if [ "${CRASHES_FOUND:-false}" = "true" ]; then
            echo "CRASHES_FOUND=true" >> "$GITHUB_ENV"
          fi

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Create issue on crash
        if: env.CRASHES_FOUND == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner,
              repo,
              title: `Fuzz testing found crashes (${new Date().toISOString().split('T')[0]})`,
              body: `Nightly fuzz testing found one or more crashes.\n\nSee [workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) for details.\n\nDownload the crash artifacts to reproduce locally.`,
              labels: ['bug', 'security']
            });
