# Opt-in MCP Registry publish. Triggered manually only (workflow_dispatch),
# gated behind the `registry` environment for human approval. Publishes the
# root server.json (kept in sync by `make sync-server-json`) to the official
# registry at registry.modelcontextprotocol.io.
name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm pushing server.json to the official registry'
        required: true
        default: ""

# One registry publish at a time, and never cancel one in flight.
concurrency:
  group: registry-publish
  cancel-in-progress: false

# Job-level permissions below (zizmor excessive-permissions): id-token: write
# mints an OIDC token, which has no business being live for the whole workflow.
permissions: {}

env:
  # Pinned, checksum-verified. This used to `curl | tar` the `latest` release
  # with no verification and `sudo install` the result into a job holding an
  # OIDC minting token — whatever upstream happened to publish that minute ran
  # as root. Bump both values together; the checksum comes from
  # registry_<version>_checksums.txt in the same release.
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: registry # protection rule -> manual approval gate
    permissions:
      contents: read
      id-token: write # for mcp-publisher github-oidc login
    steps:
      - name: Guard confirmation input
        if: ${{ github.event.inputs.confirm != 'publish' }}
        run: |
          echo "::error::confirmation input was not 'publish' — aborting"
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify server.json is in sync with Cargo.toml
        run: |
          python3 scripts/sync-server-json.py
          git diff --exit-code server.json \
            || { echo "::error::server.json drifted — run 'make sync-server-json' and commit"; exit 1; }

      - name: Install mcp-publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Authenticate to the registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
