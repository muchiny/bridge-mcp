name: Nightly Compatibility

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: compat-${{ matrix.toolchain }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test (default features)
        run: cargo nextest run --all-targets
      - name: Test (all features)
        if: matrix.toolchain != 'nightly'
        run: cargo nextest run --all-targets --all-features
      - name: Check (all features, nightly)
        if: matrix.toolchain == 'nightly'
        run: cargo check --all-targets --all-features
        continue-on-error: true

  # cargo-careful: rebuilds std + the crate with debug assertions and extra
  # UB checks, then runs the unit suite. With #![forbid(unsafe_code)] the
  # residual UB risk lives in dependencies — this is the nightly canary.
  careful:
    name: cargo careful (runtime UB checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: careful
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-careful,cargo-nextest
      - run: cargo +nightly careful test --lib
