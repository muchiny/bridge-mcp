name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Job-level permissions below (zizmor excessive-permissions).
#
# `pull_request_target` is required so PRs from forks can be labelled at all —
# the `pull_request` token is read-only there. It is safe in this specific
# workflow because actions/labeler never checks out or executes PR code: it
# reads `.github/labeler.yml` from the BASE ref and calls the labels API. Do
# not add a checkout of `github.event.pull_request.head.sha` here.
permissions: {}

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # apply/remove labels on the PR
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
