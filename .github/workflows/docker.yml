name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Same as release.yml: serialise per tag, never cancel a push in flight.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Job-level permissions below (zizmor excessive-permissions): the test job
# only reads, only build-scan-push needs packages/security-events write.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # rust-toolchain.toml outranks `rustup default` — see ci.yml. (Only affects
  # the test job. The Dockerfile's `FROM rust:<ver>-alpine` is not a real pin
  # either: `COPY . .` brings the toolchain file in, so rustup resolves the
  # compiler from it. Both are held at the MSRV so the two agree.)
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Tag pushes never go through ci.yml — run the test suite before an
  # image is built and pushed to GHCR.
  test:
    name: Test before push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # No rust-cache here: this workflow publishes artifacts on tag pushes,
      # and restoring a branch-writable cache into a publishing pipeline is
      # a cache-poisoning vector (zizmor cache-poisoning).
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets --all-features
      - run: cargo test --doc --all-features

  build-scan-push:
    name: Build, scan & push
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the scanned image to GHCR
      security-events: write # upload the Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NOTE: amd64 only. The image compiles the crate from source inside the
      # builder stage, so a linux/arm64 variant would mean a full Rust build
      # under QEMU (hours, not minutes) — and `load: true`, which the scan
      # gate below depends on, does not accept multi-platform builds. Shipping
      # arm64 needs the Dockerfile to consume the prebuilt aarch64 binary from
      # release.yml instead; tracked separately, not a drive-by change.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get scan target tag
        id: scan_target
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "tag=$(echo "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (CRITICAL + HIGH — fail)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.scan_target.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy scan (MEDIUM — warn only)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.scan_target.outputs.tag }}
          format: table
          severity: MEDIUM
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif

      - name: Push to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' '\n'); do
            docker push "$tag"
          done
