name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: bridge-mcp

jobs:
  # Tags can land on commits that never went through ci.yml (which only
  # triggers on push-to-main/PRs) — run the test suite before shipping
  # binaries, packages and provenance attestations.
  test:
    name: Test before release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets --all-features

  # The crate is not on crates.io, so the SemVer baseline is the previous
  # release tag. A breaking API change without a major bump fails the
  # release before any binary is built.
  semver:
    name: SemVer check vs previous tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Run cargo-semver-checks
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag found; skipping SemVer check"
            exit 0
          fi
          echo "Baseline: $prev"
          cargo semver-checks --baseline-rev "$prev" --default-features

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [test, semver]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz ${{ env.BINARY_NAME }}
          cd ../../..
          sha256sum ${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz > ${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/${{ env.BINARY_NAME }}-*"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json
          find . -maxdepth 1 -name '*.cdx.json' -o -name 'bom.json' | head -1 | xargs -I{} cp {} artifacts/${{ env.BINARY_NAME }}-sbom.cdx.json

      - name: Verify discovery manifest versions
        run: |
          make sync-server-json
          git diff --exit-code server.json .well-known/mcp/server-card.json dxt/manifest.json \
            || { echo "::error::Discovery manifest version drift — run 'make sync-server-json' and commit"; exit 1; }

      - name: Build DXT packages
        run: |
          for arch in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            mkdir -p dist/dxt-${arch}
            if [ -f "artifacts/${{ env.BINARY_NAME }}-${arch}.tar.gz" ]; then
              tar xzf "artifacts/${{ env.BINARY_NAME }}-${arch}.tar.gz" -C dist/dxt-${arch}/
              cp dxt/manifest.json dxt/icon.svg dist/dxt-${arch}/
              cd dist && zip -r "../artifacts/${{ env.BINARY_NAME }}-${arch}.dxt" dxt-${arch}/ && cd ..
            fi
          done

      - name: Build MCPB packages
        run: |
          for arch in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            mkdir -p dist/mcpb-${arch}
            if [ -f "artifacts/${{ env.BINARY_NAME }}-${arch}.tar.gz" ]; then
              tar xzf "artifacts/${{ env.BINARY_NAME }}-${arch}.tar.gz" -C dist/mcpb-${arch}/
              cp dxt/manifest.json dxt/icon.svg server.json dist/mcpb-${arch}/
              cd dist && zip -r "../artifacts/${{ env.BINARY_NAME }}-${arch}.mcpb" mcpb-${arch}/ && cd ..
              sha256sum "artifacts/${{ env.BINARY_NAME }}-${arch}.mcpb" >> artifacts/mcpb-checksums.sha256
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
