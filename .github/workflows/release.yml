name: Release

on:
  push:
    tags:
      - "v*"

# A publish must never be cancelled mid-flight; this only guards against two
# runs racing on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Job-level permissions below (zizmor excessive-permissions): only the
# release job writes contents / mints attestations.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: bridge-mcp
  # rust-toolchain.toml pins 1.94.0 and outranks the `rustup default` set by
  # dtolnay/rust-toolchain, so shipped binaries were built with the MSRV
  # compiler even though every step here asks for @stable. Release on stable,
  # explicitly, and let the MSRV job in ci.yml own MSRV verification.
  RUSTUP_TOOLCHAIN: stable

jobs:
  # A mistyped tag ships a binary whose name disagrees with its own
  # --version. That has already happened once here: tag v1.19.0 was pushed on
  # the commit titled "chore(release): v1.18.0".
  version-gate:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare tag against the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg n "$BINARY_NAME" '.packages[] | select(.name == $n) | .version')
          if [ "$TAG" != "v$crate" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "tag $TAG matches Cargo.toml version $crate"

  # Tags can land on commits that never went through ci.yml (which only
  # triggers on push-to-main/PRs) — run the test suite before shipping
  # binaries, packages and provenance attestations.
  test:
    name: Test before release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache in this workflow: it publishes artifacts, and restoring
      # a branch-writable cache into a publishing pipeline is a
      # cache-poisoning vector (zizmor cache-poisoning). Clean builds only.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets --all-features
      - run: cargo test --doc --all-features

  # The crate is not on crates.io, so the SemVer baseline is the previous
  # release tag. A breaking API change without a major bump fails the
  # release before any binary is built.
  semver:
    name: SemVer check vs previous tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Run cargo-semver-checks
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag found; skipping SemVer check"
            exit 0
          fi
          echo "Baseline: $prev"
          cargo semver-checks --baseline-rev "$prev" --default-features

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [version-gate, test, semver]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Matrix values reach the shell through env rather than `${{ }}`
      # interpolation (zizmor template-injection): the expansion happens before
      # the shell sees the script, so anything with a quote in it would splice
      # into the command.
      - name: Ensure target is installed
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # `--features full` (cli, mimalloc, http, jq, otel). Without it the
      # published binaries carry the default feature set — `cli` alone — so
      # they have no HTTP transport and no jq/yq filtering, and reject the
      # `jq_filter` / `output_format` params the README documents as the main
      # token-reduction lever. `make release` and `make install` have always
      # used `full`, which is why the gap never showed up in local testing.
      - name: Build (cross)
        if: matrix.cross
        env:
          TARGET: ${{ matrix.target }}
        run: cross build --release --features full --target "$TARGET"

      - name: Build (native)
        if: ${{ !matrix.cross }}
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --features full --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          archive="${BINARY_NAME}-${NAME}.tar.gz"
          tar czf "$archive" -C "target/${TARGET}/release" "$BINARY_NAME"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload its assets
      id-token: write # OIDC identity for the build-provenance attestation
      attestations: write # record the provenance attestation on the repo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json
          find . -maxdepth 1 -name '*.cdx.json' -o -name 'bom.json' \
            | head -1 | xargs -I{} cp {} "artifacts/${BINARY_NAME}-sbom.cdx.json"

      - name: Verify discovery manifest versions
        run: |
          make sync-server-json
          git diff --exit-code server.json .well-known/mcp/server-card.json dxt/manifest.json \
            || { echo "::error::Discovery manifest version drift — run 'make sync-server-json' and commit"; exit 1; }

      - name: Build DXT packages
        run: |
          for arch in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            tarball="artifacts/${BINARY_NAME}-${arch}.tar.gz"
            [ -f "$tarball" ] || continue
            mkdir -p "dist/dxt-${arch}"
            tar xzf "$tarball" -C "dist/dxt-${arch}/"
            cp dxt/manifest.json dxt/icon.svg "dist/dxt-${arch}/"
            (cd dist && zip -r "../artifacts/${BINARY_NAME}-${arch}.dxt" "dxt-${arch}/")
            # Same per-file convention as the tarballs; the .dxt used to ship
            # with no checksum at all.
            sha256sum "artifacts/${BINARY_NAME}-${arch}.dxt" \
              > "artifacts/${BINARY_NAME}-${arch}.dxt.sha256"
          done

      - name: Build MCPB packages
        run: |
          for arch in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            tarball="artifacts/${BINARY_NAME}-${arch}.tar.gz"
            [ -f "$tarball" ] || continue
            mkdir -p "dist/mcpb-${arch}"
            tar xzf "$tarball" -C "dist/mcpb-${arch}/"
            cp dxt/manifest.json dxt/icon.svg server.json "dist/mcpb-${arch}/"
            (cd dist && zip -r "../artifacts/${BINARY_NAME}-${arch}.mcpb" "mcpb-${arch}/")
            sha256sum "artifacts/${BINARY_NAME}-${arch}.mcpb" >> artifacts/mcpb-checksums.sha256
          done

      # Attest LAST. This step used to run before the SBOM and the .dxt/.mcpb
      # packages existed, so `subject-path` matched only the tarballs and every
      # other published file shipped with no provenance at all.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/${{ env.BINARY_NAME }}-*.tar.gz
            artifacts/${{ env.BINARY_NAME }}-*.dxt
            artifacts/${{ env.BINARY_NAME }}-*.mcpb
            artifacts/${{ env.BINARY_NAME }}-sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
