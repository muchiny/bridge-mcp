name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/security/**"
      - "src/config/types.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rustsec/audit-check@v2 crashes with "Unexpected end of JSON
      # input" when advisories need to be ignored — run cargo-audit
      # directly instead. It reads .cargo/audit.toml natively so the
      # ignore list stays in one place.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # cargo audit reads .cargo/audit.toml, cargo-deny reads deny.toml —
      # the RUSTSEC ignore lists are duplicated by design and must match,
      # otherwise one gate goes red while the other stays green.
      - name: Check RUSTSEC ignore lists stay in sync
        run: |
          extract() { grep -v '^[[:space:]]*#' "$1" | grep -oE 'RUSTSEC-[0-9]{4}-[0-9]+' | sort -u; }
          if ! diff <(extract deny.toml) <(extract .cargo/audit.toml); then
            echo "::error::RUSTSEC ignore lists differ between deny.toml and .cargo/audit.toml"
            exit 1
          fi
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: security
      - run: cargo test --test security_audit -- --nocapture

  unsafe-scan:
    name: Unsafe code scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: geiger
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Scan for unsafe code in dependencies
        run: cargo geiger --all-features --output-format ascii

  mutation-testing:
    name: Mutation testing (security)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants
      - name: Run mutation testing on security module
        run: cargo mutants --re '^src/security/' -- --all-features
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutants.out/
          retention-days: 30
