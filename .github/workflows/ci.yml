name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only collapse redundant PR runs. Cancelling a push-to-main run would leave
  # main with commits that never got a CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rust-toolchain.toml pins channel 1.94.0, and a toolchain file OUTRANKS the
  # `rustup default` that dtolnay/rust-toolchain sets — so without an explicit
  # RUSTUP_TOOLCHAIN every job silently ran 1.94.0 no matter which channel it
  # asked for (the MSRV job was a duplicate of Tests, and Nightly Compatibility
  # tested 1.94.0 three times). Only `+toolchain` and RUSTUP_TOOLCHAIN beat the
  # file; jobs that need a different channel override this at job level.
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Detect whether Rust-relevant paths changed so the heavy NON-required
  # jobs (msrv, feature-powerset, coverage) can skip on doc-only changes.
  # The required branch-protection checks (Format/Clippy/Tests/Deny/Typos)
  # stay unconditional — a workflow-level paths-ignore would leave doc-only
  # PRs stuck waiting on checks that never report.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'config/**'
              - 'docker-compose.test.yml'
              - '.github/workflows/ci.yml'

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [format, lint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets --all-features
      # nextest cannot run doctests (upstream limitation) and `cargo doc` only
      # renders them — without this step the compiled examples in src/ are never
      # built or executed by anything.
      - run: cargo test --doc --all-features

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The `toolchain:` input overrides the @stable ref — installs the
      # declared MSRV so `rust-version` in Cargo.toml can't silently regress.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --all-features

  feature-powerset:
    name: Feature powerset
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: hack
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Limit to depth 1 (each feature individually) and exclude meta-features.
      # Full powerset of 22 features would be millions of builds; depth 2 was
      # ~150 builds × ~30s = >75min. Depth 1 = 18 builds = ~10 min.
      - run: cargo hack check --feature-powerset --depth 1 --no-dev-deps --exclude-features full,air-gapped,all-protocols,cloud

  # Incremental mutation testing: mutate ONLY the lines touched by the PR
  # diff. Full-crate mutation is hours of compute (that's the weekly
  # sharded job in security.yml); the diff scope is minutes and catches
  # untested new logic at the moment it lands.
  mutants-diff:
    name: Mutants (diff)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-diff
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants
      - name: Mutation-test the PR diff
        # GITHUB_BASE_REF via env (never interpolated into the script) —
        # template-injection hardening, same pattern as fuzz.yml.
        run: |
          git diff "origin/${GITHUB_BASE_REF}"...HEAD > pr.diff
          # Same budget discipline as the weekly sweep in security.yml: a job
          # timeout kills the runner before the `if: always()` upload below, so
          # a diff that outgrows the budget used to throw its whole report away
          # (this job died at 45m on the ci-hardening PR with 11 of N mutants
          # done and nothing to show for it). `timeout` inside the step lets the
          # partial report upload and labels it as partial.
          #
          # The per-mutant cost is cut three ways, mirroring the weekly job:
          # `--test-tool nextest` (cargo-nextest was already installed here but
          # never used, so every mutant paid for the full `cargo test` harness),
          # `--baseline skip` (the Clippy and Tests jobs already prove the
          # unmutated tree builds and passes), and two concurrent mutants.
          #
          # `--features http` because cargo-mutants finds mutants by parsing
          # source, not by compiling it: a mutant inside a `#[cfg(feature =
          # "http")]` module is generated, then "tested" against a build where
          # neither that module nor the tests covering it exist — so it is
          # always reported MISSED and can never be killed. That is how
          # `serve -> Ok(())` in transport/http.rs showed up as a survivor even
          # though `serve_refuses_public_bind_without_oauth` asserts on exactly
          # that return value. `http` is cheap (axum/tower); the heavier
          # optional features still have this blind spot and need the same
          # treatment if a diff ever lands in them.
          set +e
          timeout --signal=INT --kill-after=2m 35m \
            cargo mutants \
              --in-diff pr.diff \
              --baseline skip \
              --test-tool nextest \
              --features http \
              --timeout-multiplier 1.5 \
              -j 2 \
              -vV
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::diff mutation exhausted its 35m budget — this report covers only part of the diff"
            echo "- diff mutation: **PARTIAL** (35m budget exhausted)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-diff-report
          path: mutants.out/
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      # cargo-llvm-cov: source-based LLVM instrumentation (precise line and
      # region counts) instead of tarpaulin's ptrace engine; integrates with
      # nextest so the run behaves exactly like the Tests job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Phase A: start the SSH test container and generate the integration
      # test config so the previously-#[ignore]'d tests in
      # ssh_integration.rs / sftp_integration.rs / e2e_docker.rs are picked
      # up by --include-ignored. Container is stopped in the always() step.
      - name: Start test SSH container
        run: |
          # Pre-pull with backoff: the lscr.io/Docker Hub registry
          # occasionally rate-limits (`toomanyrequests`), which otherwise
          # fails this whole (non-required) coverage job spuriously.
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.test.yml pull; then
              break
            fi
            echo "::warning::image pull failed (attempt $attempt) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml ps

      - name: Generate ssh_test_config.yaml fixture
        run: |
          cat > tests/ssh_test_config.yaml <<'EOF'
          # Auto-generated for CI by the coverage job. The local file is
          # gitignored. Points at the test-sshd container started by
          # docker-compose.test.yml.
          ssh_test:
            hostname: "127.0.0.1"
            port: 2222
            user: "testuser"
            auth:
              password: "testpass123"
            host_key_verification: "off"
            remote_test_dir: "/tmp/bridge-mcp-tests"
          EOF

      - name: Collect coverage (with integration tests)
        run: |
          mkdir -p coverage
          cargo llvm-cov --no-report nextest --all-features \
            --run-ignored all \
            -E 'not test(rpi::)'

      - name: Report coverage
        run: |
          report() { cargo llvm-cov report --ignore-filename-regex 'tests/e2e_raspberry\.rs' "$@"; }
          # A cobertura XML alone leaves the percentage invisible to humans, so
          # print the table into the run summary FIRST — then gate, so a failing
          # threshold still shows the number it failed on.
          report --text --summary-only | tee coverage/summary.txt
          {
            echo '## Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          report --cobertura --output-path coverage/cobertura.xml --fail-under-lines 70

      - name: Stop test SSH container
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Check rustdoc (broken links, bare URLs)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1

  deny:
    name: Deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
          config: .markdownlint.yaml
