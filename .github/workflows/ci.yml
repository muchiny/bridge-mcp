name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only collapse redundant PR runs. Cancelling a push-to-main run would leave
  # main with commits that never got a CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rust-toolchain.toml pins the MSRV channel (1.99.1 since 2026-10-17), and a
  # toolchain file OUTRANKS the `rustup default` that dtolnay/rust-toolchain
  # sets — so without an explicit RUSTUP_TOOLCHAIN every job silently ran the
  # pinned compiler no matter which channel it asked for. When that was found,
  # the pin was 1.94.0: the MSRV job was a duplicate of Tests, and Nightly
  # Compatibility tested 1.94.0 three times. Only `+toolchain` and
  # RUSTUP_TOOLCHAIN beat the file; jobs that need a different channel override
  # this at job level.
  RUSTUP_TOOLCHAIN: stable
  # Hardened lints (rust-hardening.md): counted by `hardening`, imported into
  # SonarQube Cloud by `sonar`. One list, so the two jobs cannot drift apart.
  HARDENING_LINTS: >-
    -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic -W clippy::todo
    -W clippy::unimplemented -W clippy::indexing_slicing -W clippy::arithmetic_side_effects
    -W clippy::as_conversions

jobs:
  # Detect whether Rust-relevant paths changed so the heavy NON-required
  # jobs (msrv, feature-powerset, coverage) can skip on doc-only changes.
  # The required branch-protection checks (Format/Clippy/Tests/Deny/Typos)
  # stay unconditional — a workflow-level paths-ignore would leave doc-only
  # PRs stuck waiting on checks that never report.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      release_build: ${{ steps.filter.outputs.release_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'config/**'
              - 'docker-compose.test.yml'
              - '.github/workflows/ci.yml'
            # What release.yml's build reads: a change here can break the
            # release build without touching any source file.
            release_build:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'Cross.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'

  # release.yml only runs on a tag, so a build that breaks there stayed
  # invisible until the tag was public: v4.0.0's linux-arm64 job crashed rustc
  # 1.99.1 on a `target-cpu=native` that `cross` resolved to the x86 runner
  # (#242), and its GitHub Release was never created. This replays that job —
  # same toolchain (stable), same `cross` command, same features — whenever a
  # build input changes, so a tag only ever ships a build already seen to work.
  # arm64 is the one release target built through `cross`; the other three are
  # native `cargo build`s that Tests and Clippy already exercise.
  release-build-arm64:
    name: Release build (linux-arm64)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.release_build == 'true'
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Ensure target is installed
        run: rustup target add aarch64-unknown-linux-gnu
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross
      # No rust-cache, as in release.yml: the point is to build what the
      # release will build, from scratch.
      - name: Build (cross)
        run: cross build --release --features full --target aarch64-unknown-linux-gnu

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  github-org:
    name: GitHub org spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-github-org.sh

  # The fuzz harness is a separate workspace that nothing in this workflow
  # compiled, so it drifted out of sync with the API it exercises and only
  # fuzz.yml — nightly, ASan, ~40 minutes — would have noticed. It did not:
  # a manifest error made every target fail to build, `cargo fuzz run` reports
  # that through the same exit code it uses for a crash, and the job stayed
  # green for six weeks while fuzzing nothing.
  #
  # This is the cheap half of that check, on every PR: stable, no nightly, no
  # sanitizer, no fuzzing — just "do the 50 targets still typecheck against
  # the current API". It catches signature drift the day it lands instead of
  # six weeks later.
  fuzz-harness:
    name: Fuzz harness compiles
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-harness
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [format, lint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets --all-features
      # nextest cannot run doctests (upstream limitation) and `cargo doc` only
      # renders them — without this step the compiled examples in src/ are never
      # built or executed by anything.
      - run: cargo test --doc --all-features
      # `cargo nextest run --all-targets` already built target/debug/bridge-mcp,
      # so this costs a shell invocation. It proves build.rs actually stamped
      # this checkout's SHA rather than silently falling back to "unknown".
      - name: Binary embeds this checkout's commit
        run: make verify-install BIN=target/debug/bridge-mcp

  hardening:
    # Informatif : compte les violations des lints durcis (rust-hardening.md) et
    # vérifie la baseline cargo-vet. Ne bloque jamais ; à rendre bloquant
    # quand les compteurs sont à zéro.
    name: Hardening (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-vet@0.10.2
      - name: Lints durcis (comptage)
        run: |
          # shellcheck disable=SC2086 # HARDENING_LINTS is a list of flags
          cargo clippy --locked --all-targets --all-features --message-format=short -- \
            $HARDENING_LINTS 2> hardening.txt
          # bash -e : un échec de compilation fait échouer l'étape (pas de `|| true`)
          {
            echo '### Lints durcis (non bloquant)'
            echo '```'
            sed -nE 's/^[^ ]+ (warning|error): //p' hardening.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo vet (baseline d'exemptions)
        run: cargo vet --locked

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The `toolchain:` input overrides the @stable ref — installs the
      # declared MSRV so `rust-version` in Cargo.toml can't silently regress.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo check --all-targets --all-features

  feature-powerset:
    name: Feature powerset
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hack
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      # Limit to depth 1 (each feature individually) and exclude meta-features.
      # Full powerset of 22 features would be millions of builds; depth 2 was
      # ~150 builds × ~30s = >75min. Depth 1 = 18 builds = ~10 min.
      - run: cargo hack check --feature-powerset --depth 1 --no-dev-deps --exclude-features full,air-gapped,all-protocols,cloud

  # Incremental mutation testing: mutate ONLY the lines touched by the PR
  # diff. Full-crate mutation is hours of compute (that's the weekly
  # sharded job in security.yml); the diff scope is minutes and catches
  # untested new logic at the moment it lands.
  mutants-diff:
    name: Mutants (diff)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants-diff
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest,cargo-mutants
      - name: Mutation-test the PR diff
        # GITHUB_BASE_REF via env (never interpolated into the script) —
        # template-injection hardening, same pattern as fuzz.yml.
        run: |
          git diff "origin/${GITHUB_BASE_REF}"...HEAD > pr.diff
          # Same budget discipline as the weekly sweep in security.yml: a job
          # timeout kills the runner before the `if: always()` upload below, so
          # a diff that outgrows the budget used to throw its whole report away
          # (this job died at 45m on the ci-hardening PR with 11 of N mutants
          # done and nothing to show for it). `timeout` inside the step lets the
          # partial report upload and labels it as partial.
          #
          # The per-mutant cost is cut three ways, mirroring the weekly job:
          # `--test-tool nextest` (cargo-nextest was already installed here but
          # never used, so every mutant paid for the full `cargo test` harness),
          # `--baseline skip` (the Clippy and Tests jobs already prove the
          # unmutated tree builds and passes), and two concurrent mutants.
          #
          # `--features http` because cargo-mutants finds mutants by parsing
          # source, not by compiling it: a mutant inside a `#[cfg(feature =
          # "http")]` module is generated, then "tested" against a build where
          # neither that module nor the tests covering it exist — so it is
          # always reported MISSED and can never be killed. That is how
          # `serve -> Ok(())` in transport/http.rs showed up as a survivor even
          # though `serve_refuses_public_bind_without_oauth` asserts on exactly
          # that return value. `http` is cheap (axum/tower); the heavier
          # optional features still have this blind spot and need the same
          # treatment if a diff ever lands in them.
          #
          # `--timeout-multiplier` is dead here too: with `--baseline skip`
          # there is no baseline duration to multiply against, so
          # cargo-mutants ignores it and falls back to a flat 300s test
          # timeout. `--timeout 900` replaces it explicitly.
          #
          # Measured on this job's own first real run (PR #131, ubuntu-24.04,
          # `-j 2`), which is what the number is set from rather than from a
          # local extrapolation:
          #   build phase per mutant ......... 210-369s
          #   test phase per CAUGHT mutant ...    5-25s
          # The build dominates by an order of magnitude, and the `--timeout`
          # does not apply to it — it bounds the TEST phase only. A caught
          # mutant exits at the first failing test, which is why its test
          # phase is seconds.
          #
          # What is NOT measured: a MISSED mutant runs the suite to completion,
          # and every mutant in that run was caught, so there is no observation
          # of that upper bound yet. 900s is deliberately over-generous until
          # there is one. Do not tighten it on the strength of the 5-25s
          # figure — that is the fast path, not the worst case.
          #
          # The real throughput constraint is therefore the build, not this
          # timeout: that run completed 10 of 21 mutants before exhausting its
          # 35m budget and reported PARTIAL, as designed.
          set +e
          timeout --signal=INT --kill-after=2m 35m \
            cargo mutants \
              --in-diff pr.diff \
              --baseline skip \
              --test-tool nextest \
              --features http \
              --timeout 900 \
              -j 2 \
              -vV
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::diff mutation exhausted its 35m budget — this report covers only part of the diff"
            echo "- diff mutation: **PARTIAL** (35m budget exhausted)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff-report
          path: mutants.out/
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      # cargo-llvm-cov: source-based LLVM instrumentation (precise line and
      # region counts) instead of tarpaulin's ptrace engine; integrates with
      # nextest so the run behaves exactly like the Tests job.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Phase A: start the SSH test container and generate the integration
      # test config so the #[ignore]'d tests are picked up by
      # `--run-ignored all` (nextest's flag; `--include-ignored` is libtest's).
      # Counted 2026-10-07 with grep '#\[ignore': 6 files carry them, all under
      # tests/: ssh_integration.rs, sftp_integration.rs, e2e_docker.rs,
      # integration.rs, builder_syntax.rs, e2e_raspberry.rs — the last is
      # filtered out by `not test(rpi::)` below. src/ carries none now; until
      # the sudo-password fix, src/domain/privilege.rs held one that failed on
      # purpose and killed this whole job for a month, so re-grep src/ too.
      # Container is stopped in the always() step.
      - name: Start test SSH container
        run: |
          # Pre-pull with backoff: the lscr.io/Docker Hub registry
          # occasionally rate-limits (`toomanyrequests`), which otherwise
          # fails this whole (non-required) coverage job spuriously.
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.test.yml pull; then
              break
            fi
            echo "::warning::image pull failed (attempt $attempt) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml ps

      - name: Generate ssh_test_config.yaml fixture
        run: |
          cat > tests/ssh_test_config.yaml <<'EOF'
          # Auto-generated for CI by the coverage job. The local file is
          # gitignored. Points at the test-sshd container started by
          # docker-compose.test.yml.
          ssh_test:
            hostname: "127.0.0.1"
            port: 2222
            user: "testuser"
            auth:
              password: "testpass123"
            host_key_verification: "off"
            remote_test_dir: "/tmp/bridge-mcp-tests"
          EOF

      # --no-fail-fast AND continue-on-error, both: --no-fail-fast alone still
      # exits non-zero, so `Report coverage` would not run and the artifact
      # would stay empty — which is what happened for a month. With both, one
      # failing test no longer erases the measurement; the step is marked
      # failed-but-continued, and the last step re-fails the job on it.
      - name: Collect coverage (with integration tests)
        id: collect
        continue-on-error: true
        run: |
          mkdir -p coverage
          cargo llvm-cov --no-report nextest --all-features \
            --no-fail-fast \
            --run-ignored all \
            -E 'not test(rpi::)'

      - name: Report coverage
        run: |
          report() { cargo llvm-cov report --ignore-filename-regex 'tests/e2e_raspberry\.rs' "$@"; }
          # A cobertura XML alone leaves the percentage invisible to humans, so
          # print the table into the run summary FIRST — then gate, so a failing
          # threshold still shows the number it failed on.
          report --text --summary-only | tee coverage/summary.txt
          {
            echo '## Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 96.4% measured 2026-09-01; 93 leaves three points of slack.
          # Keep in step with COVERAGE_MIN in the Makefile.
          report --cobertura --output-path coverage/cobertura.xml --fail-under-lines 93

      - name: Stop test SSH container
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          # upload-artifact defaults to `warn`: an empty coverage/ would pass
          # green having measured nothing.
          if-no-files-found: error
          retention-days: 30

      # continue-on-error hides a test failure from the job status; surface it
      # here, after the report and the artifact exist.
      - name: Fail if the collection step failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::a test failed during coverage collection (report was still produced)"
          exit 1

  # SonarQube Cloud (CI-based analysis: Automatic Analysis skips Rust). Imports
  # the llvm-cov coverage of `coverage` and a Clippy report; settings in
  # sonar-project.properties. Dependabot and fork PRs get no SONAR_TOKEN, so
  # the job is skipped for them. This job handles a secret, so every action in
  # it is pinned to a full commit SHA (Sonar rule S7637) and the checkout does
  # not persist credentials.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: coverage
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Sonar needs blame data to tell new code from old.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: sonar
      # `coverage` uploads coverage/ (summary.txt + cobertura.xml) even when it
      # fails, but `needs` only lets a green coverage job through.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage
      - name: Clippy report (JSON)
        run: |
          # The report must list every warning instead of stopping at the first
          # one; blocking on lints stays the job of `lint`.
          # shellcheck disable=SC2086 # HARDENING_LINTS is a list of flags
          RUSTFLAGS="" cargo clippy --locked --workspace --all-features --message-format=json -- $HARDENING_LINTS > clippy-report.json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs
      - name: Check rustdoc (broken links, bare URLs)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@53821664afd79bb88fcdd22fdc2f49d8d3f6cac9 # v1

  deny:
    name: Deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
          config: .markdownlint.yaml
