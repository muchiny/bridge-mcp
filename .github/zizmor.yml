# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# unpinned-uses: every action is hash-pinned, whatever its owner. A tag moves
# (and a branch such as dtolnay/rust-toolchain@stable moves daily); a commit
# SHA does not. Each pin carries its tag in a trailing `# vX.Y.Z` comment, and
# Dependabot (github-actions ecosystem) keeps both the SHA and the comment
# fresh. Release and publish workflows run with write tokens, so a hijacked
# tag there would ship a tampered binary.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
